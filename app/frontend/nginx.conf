server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: serve index.html for any unmatched route so
    # React Router deep links (e.g. /reset-password) resolve client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
